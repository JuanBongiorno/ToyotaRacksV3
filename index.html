<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suragua Pro - Control de Racks</title>
    <style>
        :root {
            --neon-blue: #00f2ff;
            --deep-blue: #020d1a;
            --card-bg: rgba(7, 18, 30, 0.97); 
            --input-dark: rgba(25, 45, 70, 0.8); /* Azul oscuro más sólido */
            --accent-grad: linear-gradient(135deg, #00d4ff 0%, #0072ff 100%);
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(rgba(2, 13, 26, 0.8), rgba(2, 13, 26, 0.9)),
                        url('https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
            overflow-x: hidden;
        }

        .card {
            width: 95%;
            max-width: 380px;
            padding: 50px 45px;
            border-radius: 30px;
            border: 1px solid rgba(0, 242, 255, 0.25);
            background: var(--card-bg);
            box-shadow: 0 25px 80px rgba(0,0,0,0.9), inset 0 0 30px rgba(0, 242, 255, 0.05);
            backdrop-filter: blur(30px);
            text-align: center;
            position: relative;
            transition: all 0.4s ease;
        }

        .logo { width: 160px; margin-bottom: 15px; filter: drop-shadow(0 0 10px rgba(0, 242, 255, 0.4)); }
        
        h2 { 
            color: var(--neon-blue); 
            font-size: 16px; 
            letter-spacing: 4px; 
            text-transform: uppercase; 
            margin-bottom: 25px;
            font-weight: 800;
        }

        .timestamp { 
            font-size: 16px; 
            margin-bottom: 30px; 
            color: #ffffff;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .group { text-align: left; margin-bottom: 25px; }
        label { font-size: 12px; color: #00d4ff; font-weight: 800; text-transform: uppercase; margin-bottom: 10px; display: block; letter-spacing: 1px; }

        /* AJUSTE PARA QUE LOS INPUTS SEAN SIEMPRE AZUL OSCURO Y NO BLANCO */
        input, textarea {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.12);
            box-sizing: border-box;
            font-size: 15px;
            background: var(--input-dark) !important; /* Forzado azul oscuro */
            color: white !important;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Evita que el autocompletado del navegador ponga el fondo blanco */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus {
            -webkit-text-fill-color: white !important;
            -webkit-box-shadow: 0 0 0px 1000px #192d46 inset !important;
            transition: background-color 5000s ease-in-out 0s;
        }

        textarea#obs {
            min-height: 120px;
            resize: none;
        }

        input:focus, textarea:focus { 
            outline: none; 
            border-color: var(--neon-blue); 
            box-shadow: 0 0 20px rgba(0,242,255,0.3);
            background: rgba(35, 60, 90, 0.9) !important;
        }

        .row { display: flex; gap: 15px; }
        .col { flex: 1; }

        .btn-camera {
            background: rgba(0, 242, 255, 0.03);
            border: 1px dashed var(--neon-blue);
            color: white;
            padding: 18px;
            width: 100%;
            border-radius: 15px;
            margin: 10px 0 25px 0;
            cursor: pointer;
            font-weight: 800;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .btn-send {
            background: #0088ff;
            border: none;
            color: black;
            font-weight: 900;
            padding: 22px;
            width: 100%;
            border-radius: 60px;
            cursor: pointer;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 8px 25px rgba(0, 136, 255, 0.5);
            transition: all 0.3s ease;
        }

        hr { border: 0; border-top: 1px solid rgba(255,255,255,0.15); margin: 20px 0; }

        .op-display {
            font-size: 24px;
            font-weight: 900;
            color: white;
            text-align: left;
            margin-top: 8px;
            text-align: center;
        }

        .toast {
            position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%);
            background: #00f2ff; color: #001a33; padding: 18px 35px; border-radius: 50px;
            font-weight: 800; font-size: 15px; transition: 0.5s; z-index: 9999;
        }
        .toast.show { bottom: 30px; }

        #login-box { display: block; }
        #form-box { display: none; }
    </style>
</head>
<body>

    <div id="toast" class="toast">Enviando en segundo plano...</div>

    <!-- PANTALLA LOGIN -->
    <div id="login-box" class="card">
        <img src="./Suragua-Logotipo-removebg-preview.png" class="logo">
        <h2 style="color: #00f2ff; letter-spacing: 6px;">CONTROL RACKS</h2>
        <div class="group">
            <input type="text" id="u" placeholder="Usuario">
        </div>
        <div class="group">
            <input type="password" id="p" placeholder="Contraseña">
        </div>
        <button class="btn-send" onclick="validar()">INGRESAR</button>
    </div>

    <!-- PANTALLA DATOS -->
    <div id="form-box" class="card">
        <img src="./Suragua-Logotipo-removebg-preview.png" class="logo">
        <h2>REPOSICIÓN DE RACKS</h2>
        <hr>
        
        <div class="group">
            <label style="color: #555;">FECHA Y HORA ACTUAL</label>
            <div class="timestamp" id="reloj">Cargando fecha...</div>
        </div>

        <div class="group">
            <label>NÚMERO DE RACK</label>
            <input type="text" id="rack" placeholder="Ingrese nro de rack (Ej: 000)">
        </div>

        <div class="row">
            <div class="col group">
                <label>BIDONES LLENOS</label>
                <input type="number" id="llenos" placeholder="Cant.">
            </div>
            <div class="col group">
                <label>BIDONES VACÍOS</label>
                <input type="number" id="vacios" placeholder="Cant.">
            </div>
        </div>

        <div class="row">
            <div class="col group">
                <label>SECTOR</label>
                <input type="text" id="sector" placeholder="Sector">
            </div>
            <div class="col group">
                <label>LUGAR</label>
                <input type="text" id="lugar" placeholder="Lugar">
            </div>
        </div>

        <div class="group">
            <label>OPERADOR RESPONSABLE</label>
            <div id="op-label" class="op-display">Ale</div>
        </div>

        <div class="group">
            <label>OBSERVACIONES</label>
            <textarea id="obs" rows="5" placeholder="Detalles adicionales del rack..."></textarea>
        </div>

        <input type="file" id="camera" accept="image/*" capture="environment" style="display:none" onchange="fotoTomada()">
        
        <button class="btn-camera" id="btn-foto" onclick="document.getElementById('camera').click()">
            📸 <span id="cam-text">TOMAR FOTO OBLIGATORIA</span>
        </button>

        <button class="btn-send" id="btn-final" onclick="enviarDatos()">ENVIAR REPORTE</button>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzHD8kSEqNOPxwDpnkYz9x6kk90RENW-ZMpejVnIV1qPclbWJO8I0Fn7AOTfCdepBpPag/exec";
        let base64Img = "";
        let nombreOperador = "Ale"; 

        setInterval(() => {
            const options = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' };
            const now = new Date();
            let fechaString = now.toLocaleDateString('es-ES', options);
            document.getElementById('reloj').innerText = fechaString.charAt(0).toUpperCase() + fechaString.slice(1);
        }, 1000);

        function validar() {
            const userInput = document.getElementById('u').value.toUpperCase();
            const passInput = document.getElementById('p').value;

            if((userInput === "ALE" || userInput === "1234") && passInput === "1234") {
                nombreOperador = (userInput === "ALE") ? "Ale" : "Operador";
                document.getElementById('op-label').innerText = nombreOperador;
                document.getElementById('login-box').style.display = 'none';
                document.getElementById('form-box').style.display = 'block';
            } else { 
                alert("Acceso denegado"); 
            }
        }

        function fotoTomada() {
            const file = document.getElementById('camera').files[0];
            const reader = new FileReader();
            reader.onloadend = function() {
                base64Img = reader.result;
                const btn = document.getElementById('btn-foto');
                btn.style.borderColor = "#00ffaa";
                btn.style.color = "#00ffaa";
                document.getElementById('cam-text').innerText = "FOTO CAPTURADA ✓";
            }
            reader.readAsDataURL(file);
        }

        function mostrarToast(mensaje, color) {
            const t = document.getElementById('toast');
            t.innerText = mensaje;
            if(color) t.style.background = color;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 4000);
        }

        function enviarDatos() {
            if(!base64Img) return alert("Falta capturar la foto obligatoria.");

            mostrarToast("Enviando reporte...", "#00f2ff");

            const payload = {
                rack: document.getElementById('rack').value,
                llenos: document.getElementById('llenos').value,
                vacios: document.getElementById('vacios').value,
                sector: document.getElementById('sector').value,
                lugar: document.getElementById('lugar').value,
                observaciones: document.getElementById('obs').value,
                operador: nombreOperador,
                imagen: base64Img
            };

            document.getElementById('rack').value = "";
            document.getElementById('llenos').value = "";
            document.getElementById('vacios').value = "";
            document.getElementById('sector').value = "";
            document.getElementById('lugar').value = "";
            document.getElementById('obs').value = "";
            base64Img = "";
            
            const btnFoto = document.getElementById('btn-foto');
            btnFoto.style.borderColor = "#00f2ff";
            btnFoto.style.color = "white";
            document.getElementById('cam-text').innerText = "TOMAR FOTO OBLIGATORIA";
            
            fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                cache: 'no-cache',
                body: JSON.stringify(payload)
            }).then(() => {
                mostrarToast("✓ Enviado con éxito", "#00ffaa");
            }).catch(e => {
                console.error("Error:", e);
                mostrarToast("⚠ Error de red", "#ff4444");
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suragua Pro - Control de Racks</title>
    <style>
        :root {
            --navy: #0b2d4d;
            --navy-deep: #061b31;
            --sky: #35b9e8;
            --sky-light: #e8f7ff;
            --card-bg: rgba(255, 255, 255, 0.97);
            --input-bg: #ffffff;
            --accent-grad: linear-gradient(135deg, #0b2d4d 0%, #147fb5 100%);
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #ffffff 0%, #e8f7ff 55%, #c9ebfa 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--navy);
            overflow-x: hidden;
        }

        .card {
            width: 95%;
            max-width: 380px;
            padding: 50px 45px;
            border-radius: 30px;
            border: 1px solid rgba(53, 185, 232, 0.45);
            background: var(--card-bg);
            box-shadow: 0 25px 80px rgba(11, 45, 77, 0.2), inset 0 0 30px rgba(53, 185, 232, 0.08);
            backdrop-filter: blur(30px);
            text-align: center;
            position: relative;
            transition: all 0.4s ease;
        }

        .logo { width: 160px; margin-bottom: 15px; filter: drop-shadow(0 0 10px rgba(53, 185, 232, 0.35)); }
        
        h2 { 
            color: var(--navy);
            font-size: 16px; 
            letter-spacing: 4px; 
            text-transform: uppercase; 
            margin-bottom: 25px;
            font-weight: 800;
        }

        .timestamp { 
            font-size: 16px; 
            margin-bottom: 30px; 
            color: var(--navy);
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .group { text-align: left; margin-bottom: 25px; }
        label { font-size: 12px; color: var(--navy); font-weight: 800; text-transform: uppercase; margin-bottom: 10px; display: block; letter-spacing: 1px; }

        /* AJUSTE PARA QUE LOS INPUTS SEAN SIEMPRE AZUL OSCURO Y NO BLANCO */
        input, textarea {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid #a9d8ed;
            box-sizing: border-box;
            font-size: 15px;
            background: var(--input-bg) !important;
            color: var(--navy) !important;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Evita que el autocompletado del navegador ponga el fondo blanco */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus {
            -webkit-text-fill-color: var(--navy) !important;
            -webkit-box-shadow: 0 0 0px 1000px #ffffff inset !important;
            transition: background-color 5000s ease-in-out 0s;
        }

        textarea#obs {
            min-height: 120px;
            resize: none;
        }

        input:focus, textarea:focus { 
            outline: none; 
            border-color: var(--sky);
            box-shadow: 0 0 20px rgba(53, 185, 232, 0.25);
            background: #ffffff !important;
        }

        .row { display: flex; gap: 15px; }
        .col { flex: 1; }

        .btn-camera {
            background: var(--sky-light);
            border: 1px dashed var(--sky);
            color: var(--navy);
            padding: 18px;
            width: 100%;
            border-radius: 15px;
            margin: 10px 0 25px 0;
            cursor: pointer;
            font-weight: 800;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .btn-send {
            background: var(--accent-grad);
            border: none;
            color: white;
            font-weight: 900;
            padding: 22px;
            width: 100%;
            border-radius: 60px;
            cursor: pointer;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 8px 25px rgba(11, 45, 77, 0.25);
            transition: all 0.3s ease;
        }

        hr { border: 0; border-top: 1px solid #c5e5f3; margin: 20px 0; }

        .op-display {
            font-size: 24px;
            font-weight: 900;
            color: var(--navy);
            text-align: left;
            margin-top: 8px;
            text-align: center;
        }

        .toast {
            position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%);
            background: var(--navy); color: white; padding: 18px 35px; border-radius: 50px;
            font-weight: 800; font-size: 15px; transition: 0.5s; z-index: 9999;
        }
        .toast.show { bottom: 30px; }

        #login-box { display: block; }
        #form-box { display: none; }
    </style>
</head>
<body>

    <div id="toast" class="toast">Enviando en segundo plano...</div>

    <!-- PANTALLA LOGIN -->
    <div id="login-box" class="card">
        <img src="./Suragua-Logotipo-removebg-preview.png" class="logo">
        <h2 style="color: var(--navy); letter-spacing: 6px;">CONTROL RACKS</h2>
        <div class="group">
            <input type="text" id="u" placeholder="Usuario">
        </div>
        <div class="group">
            <input type="password" id="p" placeholder="Contraseña">
        </div>
        <button class="btn-send" onclick="validar()">INGRESAR</button>
    </div>

    <!-- PANTALLA DATOS -->
    <div id="form-box" class="card">
        <img src="./Suragua-Logotipo-removebg-preview.png" class="logo">
        <h2>REPOSICIÓN DE RACKS</h2>
        <hr>
        
        <div class="group">
            <label>FECHA Y HORA ACTUAL</label>
            <div class="timestamp" id="reloj">Cargando fecha...</div>
        </div>
        <div class="timestamp" id="estado-red" aria-live="polite">Sincronizado</div>

        <div class="group">
            <label>NÚMERO DE RACK</label>
            <input type="text" id="rack" placeholder="Ingrese nro de rack (Ej: 000)">
        </div>

        <div class="row">
            <div class="col group">
                <label>BIDONES LLENOS</label>
                <input type="number" id="llenos" placeholder="Cant.">
            </div>
            <div class="col group">
                <label>BIDONES VACÍOS</label>
                <input type="number" id="vacios" placeholder="Cant.">
            </div>
        </div>

        <div class="row">
            <div class="col group">
                <label>SECTOR</label>
                <input type="text" id="sector" placeholder="Sector">
            </div>
            <div class="col group">
                <label>LUGAR</label>
                <input type="text" id="lugar" placeholder="Lugar">
            </div>
        </div>

        <div class="group">
            <label>OPERADOR RESPONSABLE</label>
            <div id="op-label" class="op-display">Ale</div>
        </div>

        <div class="group">
            <label>OBSERVACIONES</label>
            <textarea id="obs" rows="5" placeholder="Detalles adicionales del rack..."></textarea>
        </div>

        <input type="file" id="camera" accept="image/*" capture="environment" style="display:none" onchange="fotoTomada()">
        
        <button class="btn-camera" id="btn-foto" onclick="document.getElementById('camera').click()">
            📸 <span id="cam-text">TOMAR FOTO OBLIGATORIA</span>
        </button>

        <button class="btn-send" id="btn-final" onclick="enviarDatos()">ENVIAR REPORTE</button>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzHD8kSEqNOPxwDpnkYz9x6kk90RENW-ZMpejVnIV1qPclbWJO8I0Fn7AOTfCdepBpPag/exec";
        const DB_NAME = "suragua-offline";
        const DB_VERSION = 1;
        const STORE_NAME = "reportes-pendientes";
        let base64Img = "";
        let nombreOperador = "Ale"; 
        let sincronizando = false;

        if ('serviceWorker' in navigator && window.isSecureContext) {
            navigator.serviceWorker.register('./service-worker.js?v=2').catch(error => console.error('Service Worker:', error));
        }

        function abrirBaseDatos() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onupgradeneeded = () => request.result.createObjectStore(STORE_NAME, { keyPath: 'id' });
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        async function guardarPendiente(payload) {
            const db = await abrirBaseDatos();
            await new Promise((resolve, reject) => {
                const transaction = db.transaction(STORE_NAME, 'readwrite');
                transaction.objectStore(STORE_NAME).put({ id: crypto.randomUUID(), payload });
                transaction.oncomplete = resolve;
                transaction.onerror = () => reject(transaction.error);
            });
            db.close();
        }

        async function obtenerPendientes() {
            const db = await abrirBaseDatos();
            const pendientes = await new Promise((resolve, reject) => {
                const request = db.transaction(STORE_NAME).objectStore(STORE_NAME).getAll();
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
            db.close();
            return pendientes;
        }

        async function quitarPendiente(id) {
            const db = await abrirBaseDatos();
            await new Promise((resolve, reject) => {
                const transaction = db.transaction(STORE_NAME, 'readwrite');
                transaction.objectStore(STORE_NAME).delete(id);
                transaction.oncomplete = resolve;
                transaction.onerror = () => reject(transaction.error);
            });
            db.close();
        }

        function actualizarEstado(mensaje, color) {
            const estado = document.getElementById('estado-red');
            estado.innerText = mensaje;
            estado.style.color = color || '';
        }

        async function enviarAlServidor(payload) {
            await fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                cache: 'no-cache',
                body: JSON.stringify(payload)
            });
        }

        async function sincronizarPendientes() {
            if (sincronizando || !navigator.onLine) return;
            sincronizando = true;
            try {
                const pendientes = await obtenerPendientes();
                for (const pendiente of pendientes) {
                    await enviarAlServidor(pendiente.payload);
                    await quitarPendiente(pendiente.id);
                }
                actualizarEstado(pendientes.length ? 'Pendientes sincronizados' : 'Sincronizado', '#00ffaa');
            } catch (error) {
                console.error('Sincronización:', error);
                actualizarEstado('Sin señal: reporte guardado', '#ffcc00');
            } finally {
                sincronizando = false;
            }
        }

        window.addEventListener('online', sincronizarPendientes);
        window.addEventListener('offline', () => actualizarEstado('Sin señal: reportes en espera', '#ffcc00'));
        sincronizarPendientes();

        setInterval(() => {
            const options = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' };
            const now = new Date();
            let fechaString = now.toLocaleDateString('es-ES', options);
            document.getElementById('reloj').innerText = fechaString.charAt(0).toUpperCase() + fechaString.slice(1);
        }, 1000);

        function validar() {
            const userInput = document.getElementById('u').value.toUpperCase();
            const passInput = document.getElementById('p').value;

            if((userInput === "ALE" || userInput === "1234") && passInput === "1234") {
                nombreOperador = (userInput === "ALE") ? "Ale" : "Operador";
                document.getElementById('op-label').innerText = nombreOperador;
                document.getElementById('login-box').style.display = 'none';
                document.getElementById('form-box').style.display = 'block';
            } else { 
                alert("Acceso denegado"); 
            }
        }

        function fotoTomada() {
            const file = document.getElementById('camera').files[0];
            const reader = new FileReader();
            reader.onloadend = function() {
                base64Img = reader.result;
                const btn = document.getElementById('btn-foto');
                btn.style.borderColor = "var(--sky)";
                btn.style.color = "var(--navy)";
                document.getElementById('cam-text').innerText = "FOTO CAPTURADA ✓";
            }
            reader.readAsDataURL(file);
        }

        function mostrarToast(mensaje, color) {
            const t = document.getElementById('toast');
            t.innerText = mensaje;
            if(color) t.style.background = color;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 4000);
        }

        function enviarDatos() {
            if(!base64Img) return alert("Falta capturar la foto obligatoria.");

            const rack = document.getElementById('rack').value.trim();
            const llenos = document.getElementById('llenos').value;
            const vacios = document.getElementById('vacios').value;
            const sector = document.getElementById('sector').value.trim();
            const lugar = document.getElementById('lugar').value.trim();
            if(!rack || llenos === '' || vacios === '' || !sector || !lugar) {
                return alert("Completá rack, llenos, vacíos, sector y lugar antes de enviar.");
            }

            const payload = {
                rack,
                llenos,
                vacios,
                sector,
                lugar,
                observaciones: document.getElementById('obs').value,
                operador: nombreOperador,
                imagen: base64Img
            };

            document.getElementById('rack').value = "";
            document.getElementById('llenos').value = "";
            document.getElementById('vacios').value = "";
            document.getElementById('sector').value = "";
            document.getElementById('lugar').value = "";
            document.getElementById('obs').value = "";
            base64Img = "";
            
            const btnFoto = document.getElementById('btn-foto');
            btnFoto.classList.remove('ready');
            document.getElementById('cam-text').innerText = "CAPTURAR FOTO";

            guardarPendiente(payload).then(() => {
                if (!navigator.onLine) {
                    actualizarEstado('Sin señal: reporte en espera', '#ffcc00');
                    mostrarToast("✓ Guardado para enviar luego", "#ffcc00");
                    return;
                }
                mostrarToast("Enviando en segundo plano...", "#00f2ff");
                sincronizarPendientes().then(() => mostrarToast("✓ Enviado con éxito", "#00ffaa"));
            }).catch(error => {
                console.error("Error al guardar:", error);
                mostrarToast("⚠ No se pudo guardar el reporte", "#ff4444");
            });
        }
    </script>
</body>
</html>
